# Local development infrastructure only (docs/deployment.md §1).
# The Next.js app and worker process run on the host (`npm run dev`), not in
# this compose file — that keeps the inner dev loop fast. See
# docker-compose.prod.yml (Phase 19) for the containerized, immutable-image
# version of the app and worker themselves.
name: advportfolio

services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-advportfolio}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-advportfolio}
      POSTGRES_DB: ${POSTGRES_DB:-advportfolio}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
  redis_data:
