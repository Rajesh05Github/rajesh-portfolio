# Production-shaped stack (docs/deployment.md §2) — built images, no bind
# mounts, restart policies. Kept as a separate file from docker-compose.yml
# rather than one file with profiles, since dev (bind-mounted source, hot
# reload, app runs on the host) and this (immutable image, app runs in a
# container) have genuinely different concerns.
#
# This is for validating the Docker image itself locally before any real
# cloud spend — in actual production (Phase 21) Postgres/Redis are RDS/
# ElastiCache, not these containers (docs/deployment.md §3).
#
# Usage:
#   docker compose -f docker-compose.prod.yml run --rm migrate
#   docker compose -f docker-compose.prod.yml up -d
name: advportfolio-prod

services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-advportfolio}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-advportfolio}
      POSTGRES_DB: ${POSTGRES_DB:-advportfolio}
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_prod_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    restart: unless-stopped
    ports:
      - "${APP_PORT:-3000}:3000"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-advportfolio}:${POSTGRES_PASSWORD:-advportfolio}@postgres:5432/${POSTGRES_DB:-advportfolio}
      REDIS_URL: redis://redis:6379
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      STORAGE_LOCAL_DIR: /app/storage
      NODE_ENV: production
    volumes:
      - resume_storage:/app/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: worker
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-advportfolio}:${POSTGRES_PASSWORD:-advportfolio}@postgres:5432/${POSTGRES_DB:-advportfolio}
      REDIS_URL: redis://redis:6379
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      NODE_ENV: production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # A one-off task, not a long-running service (docs/deployment.md §5) — the
  # `tools` profile keeps it out of `docker compose up`; run it explicitly
  # with `docker compose -f docker-compose.prod.yml run --rm migrate`
  # before starting/updating `app`/`worker`.
  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: migrate
    profiles: ["tools"]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-advportfolio}:${POSTGRES_PASSWORD:-advportfolio}@postgres:5432/${POSTGRES_DB:-advportfolio}
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_prod_data:
  redis_prod_data:
  resume_storage:
